include: "https://cdn.jsdelivr.net/gh/contensis/gitlab-ci@1.0.1/cli-base.yml"

stages:
  - push-block

variables:
  block_id:
    description: "The id of the block to push to"
    value: ""
  image_uri:
    description: "The repository uri of the container image to build the block from"
    value: "$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME/app:latest"
  release:
    description: "Whether to release the block upon successful push"
    value: "false"
  make_live:
    description: "Whether to make the block live upon successful push"
    value: "false"
  branch:
    description: "The branch name in Contensis to push the block to"
    value: $CI_COMMIT_REF_NAME
  tag_repo:
    description: "Whether to push a tag to the git repo upon successful block push"
    value: "false"
  git_token:
    description: "The git token from secrets to use when tagging the git repo upon successful block push"
    value: $CI_JOB_TOKEN

push-to-contensis:
  stage: push-block
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  image: ghcr.io/contensis/cli/main/app:$cli_version
  before_script:
    - echo "Creating output.json to capture command output"
    - touch output.json
  script:
    - if [ "$release" == "true" ]; then RELEASE_FLAG="--release"; else RELEASE_FLAG=""; fi
    - if [ "$make_live" == "true" ]; then MAKE_LIVE_FLAG="--make-live"; else MAKE_LIVE_FLAG=""; fi
    - RUN_COMMAND_CONNECT="contensis connect $alias --project-id $project_id --client-id $client_id --shared-secret $shared_secret"
    - RUN_COMMAND_PUSH="contensis push block $block_id $image_uri $branch $RELEASE_FLAG $MAKE_LIVE_FLAG"
    - RUN_COMMAND_AIO="contensis push block $block_id $image_uri $branch -a $alias -p $project_id -id $client_id -s $shared_secret $RELEASE_FLAG $MAKE_LIVE_FLAG"
    - echo $RUN_COMMAND_CONNECT && echo $RUN_COMMAND_PUSH
    - if [ "$cli_splash" == "true" ]; then contensis; fi
    - $RUN_COMMAND_CONNECT && $RUN_COMMAND_PUSH --output output.json
  after_script:
    # Capture a stringified JSON variable from output.json
    - OUTPUT=$(echo "`cat output.json`" | tr "\n" " " | jq -sR .)
    - echo "command_output=$OUTPUT" >> cli.env
    - echo \$command_output - $OUTPUT
    # Parse stringified JSON and query values by path using `jq`
    - JSON=$(echo $OUTPUT | jq '. | fromjson | .')
    - VERSION_NO=$(echo $JSON | jq .version.versionNo)
    # Set $block_version var to pass on to the next job
    - echo "\$block_version is $VERSION_NO"
    - echo "block_version=$VERSION_NO" >> cli.env
    # Echo var set by caller of this job into the next job
    - echo \$tag_repo is $tag_repo
    - echo "tag_repo=$tag_repo" >> cli.env
    - echo "git_token=$git_token" >> cli.env
  artifacts:
    reports:
      dotenv: cli.env

tag-block-version:
  stage: push-block
  needs:
    - push-to-contensis
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
  script:
    - echo \$tag_repo is $tag_repo and \$block_version is $block_version
    - >
      if [ "$tag_repo" == "true" ]; then
        apk add git
        TAG=v$block_version
        echo "Tagging commit with \"$TAG\""
        git config user.email "${GITLAB_USER_EMAIL}"
        git config user.name "${GITLAB_USER_NAME}"
        git remote set-url origin https://gitlab-ci-token:${git_token}@$(echo $CI_PROJECT_URL | sed 's/https:\/\///')
        git tag $TAG --force
        git push origin $TAG
        echo "Git tag added successfully"
        echo "git_tag=$TAG" >> tag.env
      else
        echo \$tag_repo is false, not tagging
        echo "git_tag=false" >> tag.env
      fi
